<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content=" width=device-width,initial-scale=1.0">
    <title>Document</title>

    <body>
        <form action="index.php" method="POST"> 

            <label for="username">username:</label>
            <input type="text" id="usename" placeholder="username" minlength="6" maxlength="15" required><br>
            
            <label for="password">password:</label>
            <input type="password" id="password" minlength="6" maxlength="15"><br>
            
            <label for="email">email:</label>
            <input type="email" id="email" placeholder="anu@gmail.com"><br>
        
            <label for="phone">phone #:</label>
            <input type ="tel" id="phone" placeholder=""1234-5678-90 pattern="[0-9]{4}-[0-9]{4}-[0-9]{2}"><br>

            <label for="bday">birthdate:</label>
            <input type ="date" id="bday"><br>

            <label for="quantity">quantity:</label>
            <input type ="number" id="quantity" min="0" max="99" value="1"><br>

            <label for="title">title:</label>

            <label for="Mr.">Mr.:</label>
            <input type ="radio" id="Mr." value="Mr." name="title"><br>
            <label for="Ms.">Ms.:</label>
            <input type ="radio" id="Ms." value="Ms." name="title"><br>
            <label for="phD.">phD.:</label>
            <input type ="radio" id="phD." value="phD." name="title"><br>

            <label for="payment">payment:</label>
            <select id="payment">
                <option value="UPI">UPI</option><br>
                <option value="credit card">credit card</option>
                <option value="razor pay">razor pay</option><br>

                </select><br>

                <label for="file">file:</label>
                <input type ="file" id="file"><br>




            <input type = "reset"><br>
            <input type = "submit">
        
        
        
        </form>
        
    </body>
</html>
